  <script>
    // Тема застосовується до рендеру, щоб не було «блимання».
    try {
      var s = JSON.parse(localStorage.getItem('fe-trainer:v1') || '{}').settings || {};
      var t = s.theme || 'dark';
      if (t === 'auto') t = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
